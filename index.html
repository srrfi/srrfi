<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #555555;
    --brand-blue: #123a7a;
    --brand-red: #c62828;
    --card: #f5f7fa;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 40px 20px;
    text-align: center;
  }

  .logo {
    max-width: 600px;
    width: 100%;
    height: auto;
    margin-bottom: 1px;
  }

  h1 {
    font-size: clamp(28px, 4vw, 48px);
    margin-top: 3px;
    margin-bottom: 3px;
    color: var(--brand-blue);
  }

  h2 {
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 30px;
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 30px;
    margin-top: 30px;
    text-align: left;
  }

  .card h3 {
    margin-top: 0;
    color: var(--brand-blue);
  }

  ul {
    padding-left: 20px;
  }

  footer {
    margin-top: 60px;
    padding: 30px 20px;
    border-top: 1px solid #e0e0e0;
    font-size: 14px;
    color: var(--muted);
    text-align: center;
  }

  .links a {
    color: var(--brand-blue);
    text-decoration: none;
    margin: 0 10px;
    font-weight: 600;
  }

  .links a:hover {
    text-decoration: underline;
  }
</style>


</head>
